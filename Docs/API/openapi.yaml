openapi: 3.0.3
info:
  title: HRM System API
  description: >
    REST API for the full HRM system as currently analyzed: Employee Profile,
    Organization Management, Salary Master Data, and Salary Grade Promotion.
    Designed from the current User Stories / Use Cases, Information
    Architecture / Screens Hierarchy / UI-UX, the C4 model (`Docs/c4/`), and
    the database design (`Docs/Database/HRM_System.dbml`)
  version: "0.2.0"
servers:
  - url: https://api.example.com/v1

tags:
  - name: Employees
    description: Create, search, view, and update employee profiles; change employment status (US-EMP-01–05).
  - name: Organizational Units
    description: Create, view, update, move, deactivate, and reactivate organizational units (US-ORG-01–05).
  - name: Job Titles
    description: Create, update, deactivate, and reactivate the organization-wide job title catalog (US-ORG-06–08).
  - name: Base Salary Rate
    description: Maintain the organization-wide base salary rate and its effective-dated history (US-SAL-01).
  - name: Salary Scales
    description: Create and update salary scales; deactivate/reactivate (US-SAL-02, 03, 07).
  - name: Salary Grades
    description: Create salary grades and maintain effective-dated coefficients; deactivate/reactivate (US-SAL-04–06).
  - name: Review Periods
    description: Create and manage salary review periods (US-SGP-01, 02, 05, 11).
  - name: Review Period Employees
    description: Screen employees and their system-calculated proposed grade within a review period (US-SGP-03, 04).
  - name: Salary Decisions
    description: Draft, save, apply, cancel, and list official salary decisions (US-SGP-06, 07, 09, 10).
  - name: Salary History
    description: Read-only lookup of an employee's salary history (US-SGP-08).

security:
  - bearerAuth: []

paths:
  # ============================================================
  # EMPLOYEE PROFILE (US-EMP-01–05)
  # ============================================================
  /employees:
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Create an employee profile
      description: >
        US-EMP-01 — employeeCode must be unique; organizationalUnitId and
        jobTitleId must reference Active rows at the time of creation
        (BR-EMP-04/05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: employeeCode already in use, or organizationalUnitId/jobTitleId is Inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: Search and filter employees
      description: US-EMP-02 — search by code or name; filters may be combined (BR-EMP-06/07).
      parameters:
        - name: search
          in: query
          description: Matches employee code or full name.
          schema:
            type: string
        - name: organizationalUnitId
          in: query
          schema:
            type: integer
            format: int32
        - name: jobTitleId
          in: query
          schema:
            type: integer
            format: int32
        - name: employmentStatus
          in: query
          schema:
            $ref: "#/components/schemas/EmploymentStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePage"

  /employees/{employeeId}:
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Get employee profile detail
      description: US-EMP-03 — includes current Organizational Unit, Job Title, and employment status.
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee profile detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Employees]
      operationId: updateEmployee
      summary: Update an employee profile
      description: >
        US-EMP-04 — does not create a new profile. If employeeCode is
        changed it must remain unique; if organizationalUnitId/jobTitleId is
        changed it must reference an Active row, otherwise the update is
        rejected and the existing value is kept (BR-EMP-03–05, 08, 09).
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: employeeCode already in use, or the newly selected unit/title is Inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /employees/{employeeId}/employment-status:
    post:
      tags: [Employees]
      operationId: changeEmploymentStatus
      summary: Change an employee's employment status
      description: >
        US-EMP-05 — does not delete the profile or its existing information.
        Whether Terminated can return to Active on the same profile is
        unresolved (OQ-EMP-01); this endpoint does not restrict that
        transition pending a business decision.
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employmentStatus]
              properties:
                employmentStatus:
                  $ref: "#/components/schemas/EmploymentStatus"
      responses:
        "200":
          description: Employment status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================
  # ORGANIZATION MANAGEMENT (US-ORG-01–08)
  # ============================================================
  /organizational-units:
    post:
      tags: [Organizational Units]
      operationId: createOrganizationalUnit
      summary: Create an organizational unit
      description: >
        US-ORG-01 — name must be unique among units sharing the same parent
        (including among top-level units, parentId null); parentId, if
        given, must reference an Active unit. contactEmail and
        contactPhone are optional; contactEmail must be a valid email
        format if provided (BR-ORG-01–04, 21, 22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationalUnitRequest"
      responses:
        "201":
          description: Organizational unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalUnit"
        "400":
          description: Invalid contactEmail format, or other validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name already used under the same parent, or parentId is Inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Organizational Units]
      operationId: listOrganizationalUnits
      summary: View the organization structure
      description: >
        US-ORG-02 — returns the full hierarchy as a flat list (each unit
        carries parentId; the client renders the tree). Both Active and
        Inactive units are included; not paginated, since the UI needs the
        whole tree to render collapsible nodes (BR-ORG-15).
      responses:
        "200":
          description: All organizational units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationalUnit"

  /organizational-units/{unitId}:
    put:
      tags: [Organizational Units]
      operationId: updateOrganizationalUnit
      summary: Update an organizational unit
      description: >
        US-ORG-03 — editable fields are name, unitType, contactEmail,
        contactPhone. parentId is not editable here — see the move
        endpoint. Name must remain unique among units under the same
        parent (BR-ORG-03, 06, 21, 22).
      parameters:
        - $ref: "#/components/parameters/UnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationalUnitRequest"
      responses:
        "200":
          description: Organizational unit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalUnit"
        "400":
          description: Invalid contactEmail format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Name already used under this unit's parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /organizational-units/{unitId}/move:
    post:
      tags: [Organizational Units]
      operationId: moveOrganizationalUnit
      summary: Move an organizational unit under a different parent
      description: >
        US-ORG-04 — cannot move a unit under itself or under one of its own
        descendants; the target parent must be Active; a non-top-level unit
        cannot be moved to the top level (newParentId cannot be null here).
        The unit's existing subtree moves with it (BR-ORG-07–09).
      parameters:
        - $ref: "#/components/parameters/UnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newParentId]
              properties:
                newParentId:
                  type: integer
                  format: int32
      responses:
        "200":
          description: Organizational unit moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalUnit"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Target is the unit itself or one of its descendants, target is
            Inactive, or the move would duplicate a sibling name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /organizational-units/{unitId}/deactivate:
    post:
      tags: [Organizational Units]
      operationId: deactivateOrganizationalUnit
      summary: Deactivate an organizational unit
      description: >
        US-ORG-05 — blocked while the unit has active child units or active
        employees assigned to it (BR-ORG-10, 11).
      parameters:
        - $ref: "#/components/parameters/UnitId"
      responses:
        "200":
          description: Organizational unit deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalUnit"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Unit has active child units or active employees assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /organizational-units/{unitId}/reactivate:
    post:
      tags: [Organizational Units]
      operationId: reactivateOrganizationalUnit
      summary: Reactivate an organizational unit
      description: US-ORG-05 — blocked if the unit's parent (if any) is Inactive (BR-ORG-14).
      parameters:
        - $ref: "#/components/parameters/UnitId"
      responses:
        "200":
          description: Organizational unit reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalUnit"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Parent unit is Inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /job-titles:
    post:
      tags: [Job Titles]
      operationId: createJobTitle
      summary: Create a job title
      description: US-ORG-06 — name must be unique across the whole catalog (BR-ORG-17).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Job title created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTitle"
        "409":
          description: Job title name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Job Titles]
      operationId: listJobTitles
      summary: List job titles
      description: Organization-wide catalog (BR-ORG-16), used e.g. to populate the Employee create/update job title picker.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ActiveStatus"
      responses:
        "200":
          description: All job titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobTitle"

  /job-titles/{jobTitleId}:
    put:
      tags: [Job Titles]
      operationId: updateJobTitle
      summary: Update a job title
      description: US-ORG-07 — name must remain unique across the catalog (BR-ORG-17, 18).
      parameters:
        - $ref: "#/components/parameters/JobTitleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Job title updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTitle"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job title name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /job-titles/{jobTitleId}/deactivate:
    post:
      tags: [Job Titles]
      operationId: deactivateJobTitle
      summary: Deactivate a job title
      description: US-ORG-08 — employees who already hold it are unaffected (BR-ORG-19).
      parameters:
        - $ref: "#/components/parameters/JobTitleId"
      responses:
        "200":
          description: Job title deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTitle"
        "404":
          $ref: "#/components/responses/NotFound"

  /job-titles/{jobTitleId}/reactivate:
    post:
      tags: [Job Titles]
      operationId: reactivateJobTitle
      summary: Reactivate a job title
      description: US-ORG-08 — becomes available for new employee assignments again (BR-ORG-20).
      parameters:
        - $ref: "#/components/parameters/JobTitleId"
      responses:
        "200":
          description: Job title reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobTitle"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================
  # SALARY MASTER DATA (US-SAL-01–07)
  # ============================================================
  /base-salary-rates:
    post:
      tags: [Base Salary Rate]
      operationId: addBaseSalaryRate
      summary: Add a new base salary rate
      description: >
        US-SAL-01 — rate must be greater than zero; effectiveDate must be
        later than the latest recorded effective date, and cannot be
        inserted between existing dates (BR-SAL-01–04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate, effectiveDate]
              properties:
                rate:
                  type: number
                  format: double
                  minimum: 0
                  exclusiveMinimum: true
                effectiveDate:
                  type: string
                  format: date
      responses:
        "201":
          description: Base salary rate recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseSalaryRate"
        "400":
          description: Rate is zero or negative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: effectiveDate is not later than the latest recorded effective date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Base Salary Rate]
      operationId: listBaseSalaryRates
      summary: List base salary rate history
      description: >
        US-SAL-01 AC04 — pass asOfDate to retrieve the rate applicable on a
        past date; omit it to list the full history, newest first.
      parameters:
        - name: asOfDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Base salary rate history (or a single applicable rate if asOfDate is given)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BaseSalaryRate"

  /salary-scales:
    post:
      tags: [Salary Scales]
      operationId: createSalaryScale
      summary: Create a salary scale
      description: US-SAL-02 — code and name must both be unique; Active by default (BR-SAL-05, 05A, 06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                  example: NV
                name:
                  type: string
                  example: Nhan Vien
      responses:
        "201":
          description: Salary scale created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryScale"
        "409":
          description: Code or name already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Salary Scales]
      operationId: listSalaryScales
      summary: List salary scales
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ActiveStatus"
      responses:
        "200":
          description: All salary scales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryScale"

  /salary-scales/{scaleId}:
    get:
      tags: [Salary Scales]
      operationId: getSalaryScale
      summary: Get salary scale detail, including its salary grades
      parameters:
        - $ref: "#/components/parameters/ScaleId"
      responses:
        "200":
          description: Salary scale detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryScaleDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Salary Scales]
      operationId: updateSalaryScale
      summary: Update a salary scale's name
      description: US-SAL-03 — code is fixed at creation and cannot be changed here (BR-SAL-06, 07, 08).
      parameters:
        - $ref: "#/components/parameters/ScaleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Salary scale updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryScale"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Name already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salary-scales/{scaleId}/deactivate:
    post:
      tags: [Salary Scales]
      operationId: deactivateSalaryScale
      summary: Deactivate a salary scale
      description: US-SAL-07 — blocked while it contains any Active salary grade (BR-SAL-20).
      parameters:
        - $ref: "#/components/parameters/ScaleId"
      responses:
        "200":
          description: Salary scale deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryScale"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Scale contains one or more Active salary grades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salary-scales/{scaleId}/reactivate:
    post:
      tags: [Salary Scales]
      operationId: reactivateSalaryScale
      summary: Reactivate a salary scale
      description: US-SAL-07 (BR-SAL-22).
      parameters:
        - $ref: "#/components/parameters/ScaleId"
      responses:
        "200":
          description: Salary scale reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryScale"
        "404":
          $ref: "#/components/responses/NotFound"

  /salary-scales/{scaleId}/grades:
    post:
      tags: [Salary Grades]
      operationId: createSalaryGrade
      summary: Create a salary grade within a salary scale
      description: >
        US-SAL-04 — gradeNumber must be unique within this scale; the scale
        must be Active; initialCoefficient must be greater than zero and
        becomes the grade's current coefficient immediately, without an
        effective date (BR-SAL-09–12).
      parameters:
        - $ref: "#/components/parameters/ScaleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gradeNumber, initialCoefficient]
              properties:
                gradeNumber:
                  type: integer
                initialCoefficient:
                  type: number
                  format: double
                  minimum: 0
                  exclusiveMinimum: true
      responses:
        "201":
          description: Salary grade created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryGrade"
        "400":
          description: Coefficient is zero or negative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Scale is Inactive, or gradeNumber already used within this scale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salary-grades/{gradeId}/coefficients:
    post:
      tags: [Salary Grades]
      operationId: addSalaryGradeCoefficient
      summary: Record a new effective-dated coefficient for a salary grade
      description: >
        US-SAL-05 — the grade must be Active; coefficient must be greater
        than zero; effectiveDate must be later than the latest recorded
        coefficient effective date for this grade, and cannot be inserted
        between existing dates. Historical values are preserved, never
        overwritten (BR-SAL-10, 12, 13, 13A).
      parameters:
        - $ref: "#/components/parameters/GradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coefficient, effectiveDate]
              properties:
                coefficient:
                  type: number
                  format: double
                  minimum: 0
                  exclusiveMinimum: true
                effectiveDate:
                  type: string
                  format: date
      responses:
        "201":
          description: Coefficient recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryGradeCoefficient"
        "400":
          description: Coefficient is zero or negative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Grade is Inactive, or effectiveDate is not later than the latest recorded one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Salary Grades]
      operationId: listSalaryGradeCoefficients
      summary: List a salary grade's coefficient history
      description: US-SAL-05 AC04 — pass asOfDate to retrieve the coefficient applicable on a past date; omit it for the full history, newest first.
      parameters:
        - $ref: "#/components/parameters/GradeId"
        - name: asOfDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Coefficient history (or a single applicable entry if asOfDate is given)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryGradeCoefficient"
        "404":
          $ref: "#/components/responses/NotFound"

  /salary-grades/{gradeId}/deactivate:
    post:
      tags: [Salary Grades]
      operationId: deactivateSalaryGrade
      summary: Deactivate a salary grade
      description: US-SAL-06 — blocked while an active employee is currently assigned to it (BR-SAL-15).
      parameters:
        - $ref: "#/components/parameters/GradeId"
      responses:
        "200":
          description: Salary grade deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryGrade"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An active employee is currently assigned to this grade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salary-grades/{gradeId}/reactivate:
    post:
      tags: [Salary Grades]
      operationId: reactivateSalaryGrade
      summary: Reactivate a salary grade
      description: US-SAL-06 — blocked if the grade's salary scale is Inactive (BR-SAL-18).
      parameters:
        - $ref: "#/components/parameters/GradeId"
      responses:
        "200":
          description: Salary grade reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryGrade"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Salary scale is Inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ============================================================
  # SALARY GRADE PROMOTION (US-SGP-01–11)
  # ============================================================
  /review-periods:
    post:
      tags: [Review Periods]
      operationId: createReviewPeriod
      summary: Create a review period
      description: >
        US-SGP-01 — code and name must both be unique. Eligibility and the
        proposed grade for every current employee are calculated
        synchronously as part of this request and frozen as a snapshot —
        there is no separate "start review" step, and results are not
        recalculated later even if the employee's real data changes.
        effectiveDate and description are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewPeriodRequest"
      responses:
        "201":
          description: Review period created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A review period with this code or this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Review Periods]
      operationId: listReviewPeriods
      summary: Search and filter review periods
      description: US-SGP-02 — by review date range, review type, or status; criteria may be combined.
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - name: reviewType
          in: query
          schema:
            $ref: "#/components/schemas/ReviewType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewPeriodStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of review periods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriodPage"

  /review-periods/{periodId}:
    get:
      tags: [Review Periods]
      operationId: getReviewPeriod
      summary: Get review period detail
      parameters:
        - $ref: "#/components/parameters/PeriodId"
      responses:
        "200":
          description: Review period detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriodDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /review-periods/{periodId}/submit:
    post:
      tags: [Review Periods]
      operationId: submitReviewPeriod
      summary: Submit a review period to the Approver / Manager
      description: >
        US-SGP-05 — every eligible employee with a proposed grade must have
        an Approved or Rejected outcome; ineligible employees do not need
        one. Blocked otherwise.
      parameters:
        - $ref: "#/components/parameters/PeriodId"
      responses:
        "200":
          description: Review period submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriod"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: One or more eligible employees with a proposed grade are still unprocessed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review-periods/{periodId}/cancel:
    post:
      tags: [Review Periods]
      operationId: cancelReviewPeriod
      summary: Cancel a review period
      description: >
        US-SGP-11 — an IN_PROGRESS period can always be cancelled; a
        SUBMITTED period only if it has no non-cancelled salary decision.
        CLOSED and already-CANCELLED periods cannot be cancelled again.
      parameters:
        - $ref: "#/components/parameters/PeriodId"
      responses:
        "200":
          description: Review period cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriod"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Period is CLOSED/CANCELLED, or SUBMITTED with a non-cancelled decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review-periods/{periodId}/employees:
    get:
      tags: [Review Period Employees]
      operationId: listReviewPeriodEmployees
      summary: List employees in a review period with their proposed grade
      description: US-SGP-03 AC06 — filter by Organizational Unit, eligibility, or review outcome.
      parameters:
        - $ref: "#/components/parameters/PeriodId"
        - name: organizationalUnitId
          in: query
          schema:
            type: integer
            format: int32
        - name: eligible
          in: query
          schema:
            type: boolean
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/ReviewOutcome"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of employees in the review period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriodEmployeePage"
        "404":
          $ref: "#/components/responses/NotFound"

  /review-periods/{periodId}/employees/{employeeId}:
    get:
      tags: [Review Period Employees]
      operationId: getReviewPeriodEmployee
      summary: Get one employee's review detail
      description: >
        US-SGP-03/04 — the frozen salary snapshot, the system-calculated
        proposed grade, the ineligibility reason if not eligible, and
        current review outcome.
      parameters:
        - $ref: "#/components/parameters/PeriodId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee review detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriodEmployee"
        "404":
          $ref: "#/components/responses/NotFound"

  /review-periods/{periodId}/employees/{employeeId}/approve:
    post:
      tags: [Review Period Employees]
      operationId: approveReviewPeriodEmployee
      summary: Approve one employee's proposed grade
      description: >
        US-SGP-04 — only valid for an eligible employee while the period is
        IN_PROGRESS. If the previous outcome was Rejected, its reason is
        cleared (AC08).
      parameters:
        - $ref: "#/components/parameters/PeriodId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee marked as Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriodEmployee"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Employee is not eligible, or the review period is no longer IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review-periods/{periodId}/employees/{employeeId}/reject:
    post:
      tags: [Review Period Employees]
      operationId: rejectReviewPeriodEmployee
      summary: Reject one employee's proposed grade
      description: US-SGP-04 — a reason specific to this employee is required.
      parameters:
        - $ref: "#/components/parameters/PeriodId"
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Employee marked as Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPeriodEmployee"
        "400":
          description: Reason is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Employee is not eligible, or the review period is no longer IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review-periods/{periodId}/employees/bulk-approve:
    post:
      tags: [Review Period Employees]
      operationId: bulkApproveReviewPeriodEmployees
      summary: Approve multiple employees at once
      description: >
        US-SGP-04 — each selected employee is validated individually; valid
        ones are updated, invalid ones are left unchanged and reported. No
        reason required.
      parameters:
        - $ref: "#/components/parameters/PeriodId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEmployeeActionRequest"
      responses:
        "200":
          description: Result of the bulk approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The review period is no longer IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review-periods/{periodId}/employees/bulk-reject:
    post:
      tags: [Review Period Employees]
      operationId: bulkRejectReviewPeriodEmployees
      summary: Reject multiple employees at once
      description: >
        US-SGP-04 — a shared reason is required and is recorded for every
        employee that is successfully rejected, even on partial success.
      parameters:
        - $ref: "#/components/parameters/PeriodId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BulkEmployeeActionRequest"
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
      responses:
        "200":
          description: Result of the bulk rejection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"
        "400":
          description: Reason is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The review period is no longer IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salary-decisions:
    post:
      tags: [Salary Decisions]
      operationId: createSalaryDecision
      summary: Draft a salary decision from a submitted review period
      description: >
        US-SGP-06 — reviewPeriodId must be SUBMITTED with no existing
        non-cancelled decision; only employees Approved in that period can
        be included; effectiveDate must be on or after the review period's
        reviewDate. decisionNumber is system-generated. Drafting does not
        change any employee's real salary. There is no endpoint to add
        employees after creation — remove one (see DELETE below) or cancel
        and redraft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalaryDecisionRequest"
      responses:
        "201":
          description: Draft salary decision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryDecisionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Review period not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Review period is not SUBMITTED, already has a non-cancelled
            decision, an included employee is not Approved in that period,
            or effectiveDate is earlier than the review date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Salary Decisions]
      operationId: listSalaryDecisions
      summary: Search and list salary decisions
      description: US-SGP-09 — lists decisions regardless of status.
      parameters:
        - name: search
          in: query
          description: Matches decision number or review period code/name.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SalaryDecisionStatus"
        - name: reviewPeriodId
          in: query
          schema:
            type: integer
            format: int32
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of salary decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryDecisionPage"

  /salary-decisions/eligible-review-periods:
    get:
      tags: [Salary Decisions]
      operationId: listEligibleReviewPeriodsForDecision
      summary: List review periods eligible to start a new salary decision
      description: >
        US-SGP-09 AC04 — SUBMITTED review periods with no non-cancelled
        salary decision. Backs the "Pick a Review Period" step when
        creating a decision from the Salary Decision list.
      responses:
        "200":
          description: Eligible review periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewPeriod"

  /salary-decisions/{decisionId}:
    get:
      tags: [Salary Decisions]
      operationId: getSalaryDecision
      summary: Get salary decision detail
      description: US-SGP-06/09 — also used to open a decision read-only from a Salary History entry.
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      responses:
        "200":
          description: Salary decision detail, including its included employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryDecisionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Salary Decisions]
      operationId: saveSalaryDecisionDraft
      summary: Save changes to a draft salary decision
      description: >
        Wireframe "Save Draft" — currently the only editable field is
        effectiveDate, which must remain on or after the review period's
        reviewDate. Only allowed while the decision is DRAFT.
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveDate]
              properties:
                effectiveDate:
                  type: string
                  format: date
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryDecisionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Decision is not a Draft, or effectiveDate is earlier than the review date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salary-decisions/{decisionId}/employees/{employeeId}:
    delete:
      tags: [Salary Decisions]
      operationId: removeSalaryDecisionEmployee
      summary: Remove one employee from a draft decision
      description: US-SGP-06 AC04 — only allowed while the decision is still a Draft.
      parameters:
        - $ref: "#/components/parameters/DecisionId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "204":
          description: Employee removed from the draft
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Decision is not a Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salary-decisions/{decisionId}/cancel:
    post:
      tags: [Salary Decisions]
      operationId: cancelSalaryDecision
      summary: Cancel a draft salary decision
      description: >
        US-SGP-10 — only a Draft decision can be cancelled; does not change
        any employee's salary; the review period stays SUBMITTED and may be
        used to create a replacement decision.
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      responses:
        "200":
          description: Decision cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryDecisionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Decision is not a Draft (already Applied or already Cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /salary-decisions/{decisionId}/apply:
    post:
      tags: [Salary Decisions]
      operationId: applySalaryDecision
      summary: Apply a drafted salary decision
      description: >
        US-SGP-07 — all-or-nothing: for each included employee, the current
        salary grade must still match the grade captured when the draft was
        created (AC04); if any does not match, none are updated. On
        success, every included employee's salary history is updated
        effective from the decision's effectiveDate, the decision becomes
        APPLIED, and the review period becomes CLOSED — both terminal and
        irreversible. Applying is immediate; there is no separate scheduled
        update at a later date.
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      responses:
        "200":
          description: Decision applied; each employee's salary history is updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryDecisionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Decision is not a Draft, or one or more employees' current grade
            no longer matches the baseline captured at draft creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /employees/{employeeId}/salary-history:
    get:
      tags: [Salary History]
      operationId: getEmployeeSalaryHistory
      summary: Get an employee's full salary history
      description: >
        US-SGP-08 — read-only, newest first; a historical entry originating
        from a Salary Decision links back to it. Salary cannot be changed
        through this endpoint.
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: The employee's salary history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryHistoryPage"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued after login (see Arc42 ADR-07). The token-issuing login
        endpoint itself is not yet designed in this spec.

  parameters:
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    JobTitleId:
      name: jobTitleId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    ScaleId:
      name: scaleId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    GradeId:
      name: gradeId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    PeriodId:
      name: periodId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    FromDate:
      name: fromDate
      in: query
      schema:
        type: string
        format: date
    ToDate:
      name: toDate
      in: query
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: reason is required when rejecting an employee

    ActiveStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    # ---------------- Employee Profile ----------------
    EmploymentStatus:
      type: string
      enum: [ACTIVE, ON_LEAVE, TERMINATED]

    CreateEmployeeRequest:
      type: object
      required: [employeeCode, fullName, organizationalUnitId, jobTitleId, joinDate, employmentStatus]
      properties:
        employeeCode:
          type: string
          example: EMP-0001
        fullName:
          type: string
        organizationalUnitId:
          type: integer
          format: int32
        jobTitleId:
          type: integer
          format: int32
        joinDate:
          type: string
          format: date
        employmentStatus:
          $ref: "#/components/schemas/EmploymentStatus"

    UpdateEmployeeRequest:
      type: object
      properties:
        employeeCode:
          type: string
        fullName:
          type: string
        organizationalUnitId:
          type: integer
          format: int32
        jobTitleId:
          type: integer
          format: int32
        joinDate:
          type: string
          format: date

    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int32
        employeeCode:
          type: string
        fullName:
          type: string
        organizationalUnitId:
          type: integer
          format: int32
        organizationalUnitName:
          type: string
          readOnly: true
        jobTitleId:
          type: integer
          format: int32
        jobTitleName:
          type: string
          readOnly: true
        joinDate:
          type: string
          format: date
        employmentStatus:
          $ref: "#/components/schemas/EmploymentStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EmployeePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer

    # ---------------- Organization Management ----------------
    CreateOrganizationalUnitRequest:
      type: object
      required: [name, unitType]
      properties:
        name:
          type: string
        parentId:
          type: integer
          format: int32
          nullable: true
        unitType:
          type: string
          example: Department
        contactEmail:
          type: string
          format: email
          nullable: true
        contactPhone:
          type: string
          nullable: true

    UpdateOrganizationalUnitRequest:
      type: object
      properties:
        name:
          type: string
        unitType:
          type: string
        contactEmail:
          type: string
          format: email
          nullable: true
        contactPhone:
          type: string
          nullable: true

    OrganizationalUnit:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        parentId:
          type: integer
          format: int32
          nullable: true
        unitType:
          type: string
        contactEmail:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ActiveStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobTitle:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        status:
          $ref: "#/components/schemas/ActiveStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------------- Salary Master Data ----------------
    BaseSalaryRate:
      type: object
      properties:
        id:
          type: integer
          format: int32
        rate:
          type: number
          format: double
        effectiveDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    SalaryScale:
      type: object
      properties:
        id:
          type: integer
          format: int32
        code:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/ActiveStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SalaryGrade:
      type: object
      properties:
        id:
          type: integer
          format: int32
        salaryScaleId:
          type: integer
          format: int32
        gradeNumber:
          type: integer
        currentCoefficient:
          type: number
          format: double
          readOnly: true
          description: The coefficient with the latest effectiveDate on or before today.
        status:
          $ref: "#/components/schemas/ActiveStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SalaryScaleDetail:
      allOf:
        - $ref: "#/components/schemas/SalaryScale"
        - type: object
          properties:
            grades:
              type: array
              items:
                $ref: "#/components/schemas/SalaryGrade"

    SalaryGradeCoefficient:
      type: object
      properties:
        id:
          type: integer
          format: int32
        salaryGradeId:
          type: integer
          format: int32
        coefficient:
          type: number
          format: double
        effectiveDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    # ---------------- Salary Grade Promotion ----------------
    ReviewType:
      type: string
      description: Current fixed set driven by the UI; extend if the business defines more.
      enum: [ANNUAL, MID_YEAR, SPECIAL]

    ReviewPeriodStatus:
      type: string
      description: >
        There is no Draft status — a successfully created period enters
        IN_PROGRESS directly, in the same request (US-SGP-01). SUBMITTED:
        sent to the Approver / Manager (US-SGP-05). CLOSED: its salary
        decision has been applied (US-SGP-07) — terminal. CANCELLED:
        cancelled by HR Staff (US-SGP-11) — terminal.
      enum: [IN_PROGRESS, SUBMITTED, CLOSED, CANCELLED]

    ReviewOutcome:
      type: string
      description: HR Staff's screening outcome for one employee (US-SGP-04). Absent/null while eligible and not yet processed.
      enum: [PENDING, APPROVED, REJECTED]

    SalaryDecisionStatus:
      type: string
      enum: [DRAFT, APPLIED, CANCELLED]

    CreateReviewPeriodRequest:
      type: object
      required: [code, name, reviewType, reviewDate]
      properties:
        code:
          type: string
          example: RP-2026-01
        name:
          type: string
          example: Annual Review 2026
        reviewType:
          $ref: "#/components/schemas/ReviewType"
        reviewDate:
          type: string
          format: date
        effectiveDate:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true

    ReviewPeriod:
      type: object
      properties:
        id:
          type: integer
          format: int32
        code:
          type: string
        name:
          type: string
        reviewType:
          $ref: "#/components/schemas/ReviewType"
        reviewDate:
          type: string
          format: date
        effectiveDate:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ReviewPeriodStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewPeriodDetail:
      allOf:
        - $ref: "#/components/schemas/ReviewPeriod"
        - type: object
          properties:
            totalEmployees:
              type: integer
            eligibleCount:
              type: integer
            approvedCount:
              type: integer
            rejectedCount:
              type: integer
            pendingCount:
              type: integer
            decisionId:
              type: integer
              format: int32
              nullable: true
              description: >
                The non-cancelled decision already drafted from this period,
                if any (US-SGP-06/09). The UI shows "Create Decision" when
                null, or "View Decision" pointing at this id when set.

    ReviewPeriodPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewPeriod"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer

    ReviewPeriodEmployee:
      type: object
      properties:
        reviewPeriodId:
          type: integer
          format: int32
        employeeId:
          type: integer
          format: int32
        employeeCode:
          type: string
          readOnly: true
        fullName:
          type: string
          readOnly: true
        organizationalUnitName:
          type: string
          readOnly: true
          description: The employee's current unit (read live, not frozen — see Database Design notes).
        currentSalaryGradeId:
          type: integer
          format: int32
        currentGradeNumber:
          type: integer
          readOnly: true
        currentCoefficient:
          type: number
          format: double
        eligible:
          type: boolean
        proposedSalaryGradeId:
          type: integer
          format: int32
          nullable: true
        proposedGradeNumber:
          type: integer
          nullable: true
          readOnly: true
        proposedCoefficient:
          type: number
          format: double
          nullable: true
        ineligibleReason:
          type: string
          nullable: true
          description: Populated when eligible is false.
        outcome:
          $ref: "#/components/schemas/ReviewOutcome"
        rejectionReason:
          type: string
          nullable: true
          description: Populated when outcome is REJECTED.

    ReviewPeriodEmployeePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewPeriodEmployee"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    BulkEmployeeActionRequest:
      type: object
      required: [employeeIds]
      properties:
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
          minItems: 1

    BulkActionResult:
      type: object
      properties:
        succeededEmployeeIds:
          type: array
          items:
            type: integer
            format: int32
        failed:
          type: array
          items:
            type: object
            properties:
              employeeId:
                type: integer
                format: int32
              reason:
                type: string

    CreateSalaryDecisionRequest:
      type: object
      required: [reviewPeriodId, employeeIds, effectiveDate]
      properties:
        reviewPeriodId:
          type: integer
          format: int32
        employeeIds:
          type: array
          description: >
            Employees to include, from those Approved in reviewPeriodId.
            There is no endpoint to add more later.
          items:
            type: integer
            format: int32
          minItems: 1
        effectiveDate:
          type: string
          format: date
          description: Defaults to the review period's target effective date, if set, in the UI; must be on or after the review period's reviewDate.

    SalaryDecision:
      type: object
      properties:
        id:
          type: integer
          format: int32
        decisionNumber:
          type: string
          readOnly: true
          example: SD-2026-001
        reviewPeriodId:
          type: integer
          format: int32
        effectiveDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/SalaryDecisionStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SalaryDecisionEmployeeLine:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
        employeeCode:
          type: string
          readOnly: true
        fullName:
          type: string
          readOnly: true
        organizationalUnitName:
          type: string
          readOnly: true
        baselineSalaryGradeId:
          type: integer
          format: int32
        baselineGradeNumber:
          type: integer
          readOnly: true
        baselineCoefficient:
          type: number
          format: double
        newSalaryGradeId:
          type: integer
          format: int32
        newGradeNumber:
          type: integer
          readOnly: true
        newCoefficient:
          type: number
          format: double

    SalaryDecisionDetail:
      allOf:
        - $ref: "#/components/schemas/SalaryDecision"
        - type: object
          properties:
            employees:
              type: array
              items:
                $ref: "#/components/schemas/SalaryDecisionEmployeeLine"

    SalaryDecisionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SalaryDecision"
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer

    SalaryHistoryEntry:
      type: object
      properties:
        salaryGradeId:
          type: integer
          format: int32
        gradeNumber:
          type: integer
          readOnly: true
        coefficient:
          type: number
          format: double
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
        salaryDecisionId:
          type: integer
          format: int32
          nullable: true
        decisionNumber:
          type: string
          nullable: true
          readOnly: true
        isCurrent:
          type: boolean
          readOnly: true
          description: True for the entry with the latest effectiveDate on or before today.

    SalaryHistoryPage:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/SalaryHistoryEntry"
